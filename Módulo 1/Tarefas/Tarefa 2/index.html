<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tarefa 2</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    </head>
    <body class = "body">
        <header>
            <nav class = "navegation">
                <h1 class = "title">Copa do Mundo FIFA 2026</h1>
            </nav>
        </header>

        <div class = "tableDiv">
            <h2 class = "tableTitle">Artilheiros:</h2>
            <table class = "table">
                <thead>
                    <tr class = "details">
                        <th class = "stats">Colocação</th>
                        <th class = "stats">Nome</th>
                        <th class = "stats">Gols</th>
                        <th class = "stats">Seleção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class = "rank">
                        <td class = "info">1</td>
                        <td class = "info">Lionel Messi</td>
                        <td class = "info">7</td>
                        <td class = "info">Argentina</td>
                    </tr>
                    <tr class = "rankHighlight">
                        <td class = "info">2</td>
                        <td class = "info">Kyllian Mbappé</td>
                        <td class = "info">6</td>
                        <td class = "info">França</td>
                    </tr>
                    <tr class = "rank">
                        <td class = "info">3</td>
                        <td class = "info">Erling Haaland</td>
                        <td class = "info">5</td>
                        <td class = "info">Noruega</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class = "tableDiv">
            <h2 class = "tableTitle">Assistências:</h2>
            <table class = "table">
                <thead>
                    <tr class = "details">
                        <th class = "stats">Colocação</th>
                        <th class = "stats">Nome</th>
                        <th class = "stats">Assistências</th>
                        <th class = "stats">Seleção</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class = "rank">
                        <td class = "info">1</td>
                        <td class = "info">Michael Olise</td>
                        <td class = "info">5</td>
                        <td class = "info">França</td>
                    </tr>
                    <tr class = "rankHighlight">
                        <td class = "info">2</td>
                        <td class = "info">Bruno Guimarães</td>
                        <td class = "info">4</td>
                        <td class = "info">Brasil</td>
                    </tr>
                    <tr class = "rank">
                        <td class = "info">3</td>
                        <td class = "info">Roberto Alvarado</td>
                        <td class = "info">3</td>
                        <td class = "info">México</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </body>
</html>
