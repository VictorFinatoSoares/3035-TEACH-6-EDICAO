<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width= , initial-scale=1.0">
        <title>CSS: Transições e Animações</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body class = "body">
        <header>
            <nav class = "navegacao">
            </nav>
        </header>
        <div class = "container">
            <div class = "miniContainer">
                <h1 class = "title">Transições</h1>
                <div class = "rows">
                    <div class = "item text changeColorPurple">ROXO</div>
                    <div class = "item text changeColorBlue">AZUL</div>
                    <div class = "item text changeColorWhite">BRANCO</div>
                </div>
                <div class = "rows">
                    <div class = "item text changeColorGreen">VERDE</div>
                    <div class = "item text changeColorBlack">PRETO</div>
                    <div class = "item text changeColorCyan">CIANO</div>
                </div>
                <div class = "rows">
                    <div class = "item text changeColorOrange">LARANJA</div>
                    <div class = "item text changeColorRed">VERMELHO</div>
                    <div class = "item text changeColorYellow">AMARELO</div>
                </div>
            </div>

            <div class = "miniContainer">
                <h1 class = "title">Animações</h1>
                <div class = "rows">
                    <div class = "item text divAnimationPurple">ROXO</div>
                    <div class = "item text divAnimationBlue">AZUL</div>
                    <div class = "item text divAnimationWhite">BRANCO</div>
                </div>
                <div class = "rows">
                    <div class = "item text divAnimationGreen">VERDE</div>
                    <div class = "item text divAnimationBlack">PRETO</div>
                    <div class = "item text divAnimationCyan">CIANO</div>
                </div>
                <div class = "rows">
                    <div class = "item text divAnimationOrange">LARANJA</div>
                    <div class = "item text divAnimationRed">VERMELHO</div>
                    <div class = "item text divAnimationYellow">AMARELO</div>
                </div>
            </div>
        </div>
    </body>
</html>
